name: PTT Crawler Alert

on:
  schedule:
    # 每 15 分鐘自動執行一次 (使用 UTC 時間)
    - cron: '*/15 * * * *'
  # 允許手動在 GitHub 介面上點選按鈕觸發測試
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      # 1. 下載專案程式碼
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安裝爬蟲所需的套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # 4. 執行爬蟲腳本
      - name: Run Crawler
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      # 5. 將更新後的通知歷史記錄寫回 Git (避免重複推播)
      - name: Commit and push updated history
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add notified.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update notified history" && git push)
